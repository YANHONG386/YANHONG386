<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">YANHONG386 player profile</title>
  <desc id="desc">Animated cyber anime HUD for a full-stack developer, anime enthusiast, and hardcore gamer.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071127"/>
      <stop offset="0.48" stop-color="#101b40"/>
      <stop offset="1" stop-color="#25184e"/>
    </linearGradient>
    <linearGradient id="meter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5de3ff"/>
      <stop offset="0.52" stop-color="#8e7bff"/>
      <stop offset="1" stop-color="#f273b8"/>
    </linearGradient>
    <linearGradient id="rank" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5e59e3" stop-opacity=".52"/>
      <stop offset="1" stop-color="#ee64b5" stop-opacity=".28"/>
    </linearGradient>
    <radialGradient id="cyanGlow"><stop offset="0" stop-color="#45dcff" stop-opacity=".34"/><stop offset="1" stop-color="#45dcff" stop-opacity="0"/></radialGradient>
    <radialGradient id="pinkGlow"><stop offset="0" stop-color="#f16fbd" stop-opacity=".28"/><stop offset="1" stop-color="#f16fbd" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#78dbff" stroke-opacity=".13" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="76 38" dur="18s" repeatCount="indefinite"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="panelShadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="13" stdDeviation="13" flood-color="#000" flood-opacity=".34"/></filter>
    <clipPath id="frame"><rect width="1200" height="360" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <circle cx="50" cy="365" r="250" fill="url(#cyanGlow)"><animate attributeName="cx" values="50;150;50" dur="11s" repeatCount="indefinite"/><animate attributeName="cy" values="365;315;365" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="15" r="245" fill="url(#pinkGlow)"><animate attributeName="cx" values="1150;1060;1150" dur="13s" repeatCount="indefinite"/><animate attributeName="cy" values="15;75;15" dur="10s" repeatCount="indefinite"/></circle>
    <rect width="820" height="360" fill="url(#grid)"/>
    <rect x="0" y="-70" width="1200" height="72" fill="url(#cyanGlow)" opacity=".56"><animate attributeName="y" values="-75;405" dur="6.5s" repeatCount="indefinite"/></rect>

    <g font-family="Inter,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif">
      <circle cx="58" cy="61" r="5" fill="#5ce2d1" filter="url(#softGlow)"><animate attributeName="opacity" values="1;.28;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="76" y="66" fill="#67e7ff" font-family="Consolas,monospace" font-size="15" font-weight="700" letter-spacing="3">SYSTEM // PLAYER PROFILE</text>
      <text x="58" y="139" fill="#f7f8ff" font-size="56" font-weight="800" letter-spacing="1">YANHONG386</text>
      <text x="58" y="178" fill="#d5ddff" font-size="22" font-weight="650">全栈开发工程师 × 重度二次元 × 深度游戏玩家</text>

      <g font-family="Consolas,monospace" font-size="14" font-weight="700">
        <g transform="translate(58 207)"><rect width="150" height="36" rx="7" fill="#334a82" fill-opacity=".28" stroke="#67dbff" stroke-opacity=".46"/><text x="75" y="23" fill="#deecff" text-anchor="middle">FULL-STACK DEV</text></g>
        <g transform="translate(220 207)"><rect width="132" height="36" rx="7" fill="#334a82" fill-opacity=".28" stroke="#67dbff" stroke-opacity=".46"/><text x="66" y="23" fill="#deecff" text-anchor="middle">AI EXPLORER</text></g>
        <g transform="translate(58 253)"><rect width="86" height="36" rx="7" fill="#334a82" fill-opacity=".28" stroke="#67dbff" stroke-opacity=".46"/><text x="43" y="23" fill="#deecff" text-anchor="middle">OTAKU</text></g>
        <g transform="translate(156 253)"><rect width="164" height="36" rx="7" fill="#334a82" fill-opacity=".28" stroke="#67dbff" stroke-opacity=".46"/><text x="82" y="23" fill="#deecff" text-anchor="middle">HARDCORE GAMER</text></g>
      </g>
      <text x="58" y="334" fill="#a6dcff" fill-opacity=".38" font-family="Consolas,monospace" font-size="12" font-weight="700" letter-spacing="8">アニメ・コード・ゲーム</text>
    </g>

    <g filter="url(#panelShadow)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="6s" repeatCount="indefinite"/>
      <rect x="738" y="36" width="404" height="276" rx="14" fill="#090f27" fill-opacity=".88" stroke="#68dfff" stroke-opacity=".38"><animate attributeName="stroke" values="#68dfff;#f273b8;#68dfff" dur="3.6s" repeatCount="indefinite"/></rect>
      <path d="M738 80H1142" stroke="#77dfff" stroke-opacity=".22"/>
      <circle cx="758" cy="58" r="5" fill="#ff6fae"/><circle cx="775" cy="58" r="5" fill="#f9c559"/><circle cx="792" cy="58" r="5" fill="#5ce2d1"/>
      <text x="812" y="63" fill="#98a9d6" font-family="Consolas,monospace" font-size="11" font-weight="700" letter-spacing="1.2">YANHONG_OS / PROFILE.exe</text>

      <path d="M770 104H852L864 116V202L852 214H770L758 202V116Z" fill="url(#rank)" stroke="#f274bc" stroke-opacity=".56"/>
      <text x="811" y="140" text-anchor="middle" fill="#e69bff" font-family="Consolas,monospace" font-size="11" font-weight="700">LEVEL</text>
      <text x="811" y="179" text-anchor="middle" fill="#78eaff" font-family="Consolas,monospace" font-size="35" font-weight="800" filter="url(#softGlow)">386</text>

      <g font-family="Consolas,monospace" font-size="11" font-weight="700">
        <text x="890" y="112" fill="#8594bd">CLASS</text><text x="1118" y="112" fill="#f2f5ff" text-anchor="end">FULL-STACK DEV</text>
        <text x="890" y="146" fill="#8594bd">OTAKU</text><text x="1118" y="146" fill="#f2f5ff" text-anchor="end">MAX</text>
        <rect x="890" y="157" width="228" height="6" rx="3" fill="#28304f"/><rect x="890" y="157" width="219" height="6" rx="3" fill="url(#meter)"/>
        <rect x="865" y="157" width="34" height="6" fill="#fff" opacity="0"><animate attributeName="x" values="865;1125" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="2.6s" repeatCount="indefinite"/></rect>
        <text x="890" y="190" fill="#8594bd">GAMER</text><text x="1118" y="190" fill="#f2f5ff" text-anchor="end">HARDCORE</text>
        <rect x="890" y="201" width="228" height="6" rx="3" fill="#28304f"/><rect x="890" y="201" width="210" height="6" rx="3" fill="url(#meter)"/>
        <rect x="865" y="201" width="34" height="6" fill="#fff" opacity="0"><animate attributeName="x" values="865;1125" dur="2.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="2.9s" repeatCount="indefinite"/></rect>
      </g>

      <path d="M738 236H1142" stroke="#77dfff" stroke-opacity=".16"/>
      <g font-family="Consolas,monospace" font-size="10" font-weight="700" text-anchor="middle">
        <g transform="translate(836 255)"><rect width="66" height="31" rx="5" fill="#67e7ff"/><text x="33" y="20" fill="#07101d">CODE</text></g>
        <g transform="translate(912 255)"><rect width="66" height="31" rx="5" fill="#141b39" stroke="#303b68"/><text x="33" y="20" fill="#aeb9da">ANIME</text></g>
        <g transform="translate(988 255)"><rect width="66" height="31" rx="5" fill="#141b39" stroke="#303b68"/><text x="33" y="20" fill="#aeb9da">GAME</text></g>
        <g transform="translate(1064 255)"><rect width="50" height="31" rx="5" fill="#141b39" stroke="#303b68"/><text x="25" y="20" fill="#aeb9da">AI</text></g>
      </g>
    </g>

    <g filter="url(#softGlow)">
      <circle cx="682" cy="73" r="3" fill="#72eaff"><animate attributeName="cy" values="73;43;73" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".3;1;.3" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="655" cy="274" r="3" fill="#f17cc3"><animate attributeName="cy" values="274;240;274" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values=".25;1;.25" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="1160" cy="323" r="3" fill="#72eaff"><animate attributeName="cy" values="323;289;323" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".25;1;.25" dur="8s" repeatCount="indefinite"/></circle>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="21" fill="none" stroke="#74dfff" stroke-opacity=".20" stroke-width="2"/>
</svg>
