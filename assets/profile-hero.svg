<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">YHONG 386 profile</title>
  <desc id="desc">Animated ice blue, violet and sakura pink profile banner for a full-stack developer, anime enthusiast and hardcore gamer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27477f"><animate attributeName="stop-color" values="#27477f;#31578e;#27477f" dur="14s" repeatCount="indefinite"/></stop>
      <stop offset=".52" stop-color="#5351a1"><animate attributeName="stop-color" values="#5351a1;#6259ad;#5351a1" dur="14s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#784d8d"><animate attributeName="stop-color" values="#784d8d;#845389;#784d8d" dur="14s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#68e2fa"/><stop offset=".53" stop-color="#a68cf4"/><stop offset="1" stop-color="#ef82b7"/></linearGradient>
    <radialGradient id="cyan"><stop stop-color="#70deff" stop-opacity=".52"/><stop offset="1" stop-color="#70deff" stop-opacity="0"/></radialGradient>
    <radialGradient id="pink"><stop stop-color="#f27ebc" stop-opacity=".38"/><stop offset="1" stop-color="#f27ebc" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#edfaff" stroke-opacity=".13"/><animateTransform attributeName="patternTransform" type="translate" from="0 0" to="80 40" dur="22s" repeatCount="indefinite"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-25%" y="-35%" width="150%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#211a59" flood-opacity=".28"/></filter>
    <clipPath id="clip"><rect width="1200" height="380" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <circle cx="990" cy="-20" r="260" fill="url(#cyan)"><animate attributeName="cx" values="990;1080;990" dur="11s" repeatCount="indefinite"/><animate attributeName="cy" values="-20;45;-20" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="415" r="270" fill="url(#pink)"><animate attributeName="cx" values="90;185;90" dur="13s" repeatCount="indefinite"/><animate attributeName="cy" values="415;340;415" dur="10s" repeatCount="indefinite"/></circle>
    <rect x="430" width="770" height="380" fill="url(#grid)" opacity=".9"/>

    <g opacity=".55" filter="url(#blur)">
      <path d="M720 210C865 108 994 294 1240 102" fill="none" stroke="url(#accent)" stroke-width="52"><animateTransform attributeName="transform" type="translate" values="120 0;-145 0;120 0" dur="10s" repeatCount="indefinite"/></path>
    </g>

    <g opacity="0">
      <line x1="-180" y1="74" x2="-35" y2="43" stroke="#fff" stroke-width="2" filter="url(#glow)"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;1450 190" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.18;.28;.52;1" dur="8s" repeatCount="indefinite"/>
    </g>

    <g font-family="Inter,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif">
      <circle cx="60" cy="63" r="5" fill="#70f0df" filter="url(#glow)"><animate attributeName="opacity" values="1;.26;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="78" y="68" fill="#a5f3ff" font-family="Consolas,monospace" font-size="14" font-weight="700" letter-spacing="3">PROFILE / ONLINE</text>

      <text x="56" y="157" fill="#fff" font-size="66" font-weight="800" letter-spacing="-1">YHONG</text>
      <text x="279" y="157" fill="#d4daf3" font-size="66" font-weight="300">/</text>
      <text x="317" y="157" fill="none" stroke="#e9eaff" stroke-width="1.5" font-size="66" font-weight="800">386<animate attributeName="stroke" values="#d9dcff;#ffffff;#d9dcff" dur="3.5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".72;1;.72" dur="3.5s" repeatCount="indefinite"/></text>

      <text x="59" y="199" fill="#f0f2ff" font-size="21" font-weight="650">全栈开发工程师 · 重度二次元 · 深度游戏玩家</text>
      <g font-family="Consolas,monospace" font-size="12" font-weight="700">
        <g transform="translate(58 229)"><rect width="132" height="32" rx="6" fill="#263b78" fill-opacity=".32" stroke="#b8ecff" stroke-opacity=".34"/><text x="66" y="21" fill="#f0f5ff" text-anchor="middle">FULL-STACK DEV</text></g>
        <g transform="translate(200 229)"><rect width="116" height="32" rx="6" fill="#263b78" fill-opacity=".32" stroke="#b8ecff" stroke-opacity=".34"/><text x="58" y="21" fill="#f0f5ff" text-anchor="middle">AI EXPLORER</text></g>
        <g transform="translate(326 229)"><rect width="68" height="32" rx="6" fill="#263b78" fill-opacity=".32" stroke="#b8ecff" stroke-opacity=".34"/><text x="34" y="21" fill="#f0f5ff" text-anchor="middle">OTAKU</text></g>
        <g transform="translate(404 229)"><rect width="72" height="32" rx="6" fill="#263b78" fill-opacity=".32" stroke="#b8ecff" stroke-opacity=".34"/><text x="36" y="21" fill="#f0f5ff" text-anchor="middle">GAMER</text></g>
      </g>
      <text x="59" y="318" fill="#eef3ff" fill-opacity=".60" font-family="Consolas,monospace" font-size="12" font-weight="700" letter-spacing="7">コードで、世界をつくる。</text>
    </g>

    <g filter="url(#shadow)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="7s" repeatCount="indefinite"/>
      <rect x="846" y="44" width="294" height="268" rx="16" fill="#1b1f56" fill-opacity=".50" stroke="#d3f1ff" stroke-opacity=".32"><animate attributeName="stroke" values="#d3f1ff;#f5aadc;#d3f1ff" dur="4s" repeatCount="indefinite"/></rect>
      <path d="M866 102H1120" stroke="#d9efff" stroke-opacity=".16"/>
      <text x="866" y="78" fill="#dce6ff" fill-opacity=".68" font-family="Consolas,monospace" font-size="10" font-weight="700" letter-spacing="1.8">PLAYER PROFILE</text>
      <text x="1120" y="82" fill="#fff" text-anchor="end" font-family="Consolas,monospace" font-size="25" font-weight="800">386</text>
      <text x="866" y="135" fill="#b8c5ea" font-family="Consolas,monospace" font-size="9" font-weight="700" letter-spacing="1.4">CURRENT CLASS</text>
      <text x="866" y="163" fill="#9bedff" font-family="Consolas,monospace" font-size="19" font-weight="800">FULL-STACK DEV</text>
      <g font-family="Consolas,monospace" font-size="12" font-weight="700" fill="#e1e8ff">
        <circle cx="871" cy="198" r="4" fill="#a68cf4" filter="url(#glow)"/><text x="887" y="202">CODE / PRODUCT</text>
        <circle cx="871" cy="232" r="4" fill="#ef82b7" filter="url(#glow)"/><text x="887" y="236">ANIME / ACG</text>
        <circle cx="871" cy="266" r="4" fill="#68e2fa" filter="url(#glow)"/><text x="887" y="270">GAME / IMMERSION</text>
      </g>
    </g>

    <g filter="url(#glow)">
      <circle cx="675" cy="70" r="3" fill="#b9f6ff"><animate attributeName="cy" values="70;43;70" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".3;1;.3" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="740" cy="284" r="3" fill="#ffc1e2"><animate attributeName="cy" values="284;248;284" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values=".25;1;.25" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="1160" cy="335" r="3" fill="#b9f6ff"><animate attributeName="cy" values="335;298;335" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".25;1;.25" dur="8s" repeatCount="indefinite"/></circle>
    </g>

    <rect x="-280" y="376" width="280" height="3" fill="url(#accent)" filter="url(#glow)"><animate attributeName="x" values="-280;1200" dur="6s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="1" y="1" width="1198" height="378" rx="23" fill="none" stroke="#edfaff" stroke-opacity=".20" stroke-width="2"/>
</svg>
