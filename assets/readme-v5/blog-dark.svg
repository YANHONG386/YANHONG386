<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230">
<title>访问个人博客 yhong386.com</title><desc>清晰矢量文字、彩色标识与流动光线；YANHONG386 的 GitHub 个人主页。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#211e2c"/><stop offset="1" stop-color="#232b39"/></linearGradient><linearGradient id="flow"><stop stop-color="#76c7e8" stop-opacity="0"/><stop offset=".35" stop-color="#76c7e8"/><stop offset=".65" stop-color="#b596eb"/><stop offset=".9" stop-color="#eaa2bd"/><stop offset="1" stop-color="#eaa2bd" stop-opacity="0"/></linearGradient><clipPath id="clip"><rect x="1" y="1" width="998" height="228" rx="20"/></clipPath></defs>
<style>@media(prefers-reduced-motion:reduce){.motion{display:none}}</style>
<rect x="1" y="1" width="998" height="228" rx="20" fill="url(#bg)" stroke="#453b56"/>
<g clip-path="url(#clip)"><circle class="motion" cx="935" cy="30" r="85" fill="#b397df" opacity=".06"><animate attributeName="cx" values="935;880;935" dur="10s" repeatCount="indefinite"/></circle>
<g font-family="Segoe UI,Microsoft YaHei,Noto Sans SC,sans-serif"><defs><pattern id="blog-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d0b4f5" stroke-opacity=".11" stroke-width="1"/><animateTransform attributeName="patternTransform" type="translate" from="0 0" to="32 32" dur="10s" repeatCount="indefinite"/></pattern><linearGradient id="blog-grid-fade"><stop stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient><mask id="blog-grid-mask"><rect x="690" y="0" width="310" height="230" fill="url(#blog-grid-fade)"/></mask></defs><rect class="motion" x="690" y="0" width="310" height="230" fill="url(#blog-grid)" mask="url(#blog-grid-mask)"/><g class="motion" transform="translate(860 101)"><circle r="43" fill="none" stroke="#d0b4f5" stroke-opacity=".14"/><circle r="66" fill="none" stroke="#d0b4f5" stroke-opacity=".1"/><g><circle cx="43" cy="0" r="5" fill="#b596eb"/><circle cx="-66" cy="0" r="3.5" fill="#76c7e8"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/></g><text y="10" text-anchor="middle" font-size="31" fill="#d0b4f5">✦</text></g><text x="28" y="39" font-size="13" letter-spacing="2" fill="#d0b4f5">PERSONAL BLOG / NOTES</text><text x="28" y="98" font-size="48" font-weight="750" fill="#f2ecff">yhong386.com</text><text x="29" y="137" fill="#c6bad9" font-size="23">全栈开发实践 · AI 探索笔记</text><text x="29" y="169" fill="#c6bad9" font-size="23">二次元与游戏生活</text><path d="M914 190l24-24m-24 0h24v24" stroke="#d0b4f5" stroke-width="2.5" stroke-linecap="round" fill="none"/></g>
<rect class="motion" id="flow-runner" x="-250" y="226" width="250" height="3" fill="url(#flow)"><animate attributeName="x" values="-250;1000" dur="4.8s" repeatCount="indefinite"/></rect></g>
</svg>