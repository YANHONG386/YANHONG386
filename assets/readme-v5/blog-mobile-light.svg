<svg xmlns="http://www.w3.org/2000/svg" width="440" height="230" viewBox="0 0 440 230">
<title>访问个人博客 yhong386.com</title><desc>清晰矢量文字、彩色标识与流动光线；YANHONG386 的 GitHub 个人主页。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f7fc"/><stop offset="1" stop-color="#f1f5fc"/></linearGradient><linearGradient id="flow"><stop stop-color="#76c7e8" stop-opacity="0"/><stop offset=".35" stop-color="#76c7e8"/><stop offset=".65" stop-color="#b596eb"/><stop offset=".9" stop-color="#eaa2bd"/><stop offset="1" stop-color="#eaa2bd" stop-opacity="0"/></linearGradient><clipPath id="clip"><rect x="1" y="1" width="438" height="228" rx="20"/></clipPath></defs>
<style>@media(prefers-reduced-motion:reduce){.motion{display:none}}</style>
<rect x="1" y="1" width="438" height="228" rx="20" fill="url(#bg)" stroke="#dfdbea"/>
<g clip-path="url(#clip)"><circle class="motion" cx="375" cy="30" r="85" fill="#b397df" opacity=".06"><animate attributeName="cx" values="375;320;375" dur="10s" repeatCount="indefinite"/></circle>
<g font-family="Segoe UI,Microsoft YaHei,Noto Sans SC,sans-serif"><defs><pattern id="blog-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8066b5" stroke-opacity=".11" stroke-width="1"/><animateTransform attributeName="patternTransform" type="translate" from="0 0" to="32 32" dur="10s" repeatCount="indefinite"/></pattern><linearGradient id="blog-grid-fade"><stop stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient><mask id="blog-grid-mask"><rect x="245" y="0" width="195" height="230" fill="url(#blog-grid-fade)"/></mask></defs><rect class="motion" x="245" y="0" width="195" height="230" fill="url(#blog-grid)" mask="url(#blog-grid-mask)"/><text x="28" y="39" font-size="11" letter-spacing="2" fill="#8066b5">PERSONAL BLOG / NOTES</text><text x="28" y="98" font-size="38" font-weight="750" fill="#2e293b">yhong386.com</text><text x="29" y="137" fill="#665d78" font-size="17">全栈开发实践 · AI 探索笔记</text><text x="29" y="169" fill="#665d78" font-size="17">二次元与游戏生活</text><path d="M388 190l24-24m-24 0h24v24" stroke="#8066b5" stroke-width="2.5" stroke-linecap="round" fill="none"/></g>
<rect class="motion" id="flow-runner" x="-110" y="226" width="110" height="3" fill="url(#flow)"><animate attributeName="x" values="-110;440" dur="4.8s" repeatCount="indefinite"/></rect></g>
</svg>