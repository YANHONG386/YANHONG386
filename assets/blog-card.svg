<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">YANHONG386 personal blog</title>
  <desc id="desc">Personal blog about full-stack development, AI, anime and games at yhong386.com.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3faff"/><stop offset=".55" stop-color="#f7f4ff"/><stop offset="1" stop-color="#fff3f8"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5fc9e7"/><stop offset=".53" stop-color="#9381e5"/><stop offset="1" stop-color="#e47cac"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="1200" height="220" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)" font-family="Inter,Segoe UI,Noto Sans SC,Microsoft YaHei,sans-serif">
    <rect width="1200" height="220" fill="url(#bg)"/>
    <circle cx="1090" cy="12" r="150" fill="#9b84e6" fill-opacity=".07"><animate attributeName="cx" values="1090;1040;1090" dur="10s" repeatCount="indefinite"/></circle>
    <text x="1052" y="132" fill="#806bc4" fill-opacity=".07" text-anchor="middle" font-size="200" font-weight="900">Y</text>
    <text x="48" y="46" fill="#806bc4" font-family="Consolas,monospace" font-size="11" font-weight="700" letter-spacing="2.4">PERSONAL BLOG / NOTES</text>
    <text x="48" y="94" fill="#20263a" font-size="35" font-weight="800">yhong386.com</text>
    <text x="48" y="127" fill="#5d6576" font-size="17">记录全栈开发实践、AI 探索笔记，以及二次元与游戏生活</text>
    <g font-family="Consolas,monospace" font-size="10" font-weight="700" fill="#6b6383">
      <g transform="translate(48 151)"><rect width="46" height="26" rx="5" fill="#fff" stroke="#dcdeea"/><text x="23" y="17" text-anchor="middle">DEV</text></g>
      <g transform="translate(102 151)"><rect width="38" height="26" rx="5" fill="#fff" stroke="#dcdeea"/><text x="19" y="17" text-anchor="middle">AI</text></g>
      <g transform="translate(148 151)"><rect width="62" height="26" rx="5" fill="#fff" stroke="#dcdeea"/><text x="31" y="17" text-anchor="middle">ANIME</text></g>
      <g transform="translate(218 151)"><rect width="58" height="26" rx="5" fill="#fff" stroke="#dcdeea"/><text x="29" y="17" text-anchor="middle">GAMES</text></g>
    </g>
    <g transform="translate(923 139)">
      <rect width="224" height="48" rx="8" fill="#111831"/>
      <text x="112" y="30" fill="#fff" text-anchor="middle" font-family="Consolas,monospace" font-size="12" font-weight="700" letter-spacing="1">VISIT BLOG  ↗</text>
    </g>
    <rect x="-260" y="217" width="260" height="3" fill="url(#accent)" filter="url(#glow)"><animate attributeName="x" values="-260;1200" dur="5.6s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="1" y="1" width="1198" height="218" rx="17" fill="none" stroke="#dce1ee" stroke-width="2"/>
</svg>
