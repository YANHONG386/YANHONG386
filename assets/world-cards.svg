      <text x="30" y="115" fill="#202632" font-size="21" font-weight="750">Full-stack</text>
      <text x="30" y="147" fill="#68717d" font-size="14">Java / Spring · Vue / React</text>
      <text x="30" y="174" fill="#68717d" font-size="14">从服务到界面，完整构建产品体验。</text>
