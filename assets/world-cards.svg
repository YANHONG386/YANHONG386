  <circle cx="373" cy="27" r="3" fill="#66cde9"><animate attributeName="opacity" values=".25;1;.25" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="777" cy="27" r="3" fill="#9885ed"><animate attributeName="opacity" values=".25;1;.25" dur="3.4s" repeatCount="indefinite"/></circle>
