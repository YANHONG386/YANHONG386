      <rect x="434" y="34" width="46" height="46" rx="11" fill="#f0ecff"/>
      <text x="457" y="64" fill="#8069dd" text-anchor="middle" font-size="23" font-weight="800" filter="url(#glow)">✦</text>
      <text x="434" y="115" fill="#202632" font-size="21" font-weight="750">AI &amp; Automation</text>
      <text x="434" y="147" fill="#68717d" font-size="14">Agent · Prompt · Workflow</text>
      <text x="434" y="174" fill="#68717d" font-size="14">探索智能体与有趣的自动化实践。</text>
    </g>
    <g>
